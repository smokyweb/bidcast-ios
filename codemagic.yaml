workflows:
  ios-release:
    name: BidCast iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_cred
      vars:
        BUNDLE_ID: io.bidcast
        TEAM_ID: YQGQU3RV34
        IOS_MARKETING_VERSION: 1.0
        IOS_MIN_BUILD_NUMBER: 403
      xcode: "26.4"
    scripts:
      - name: Inspect Xcode project layout
        script: |
          ls -la
          find . -maxdepth 2 \( -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name 'Podfile' \) | sort
      - name: Set up code signing
        script: |
          keychain initialize
          python3 setup_signing.py
          export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/dist_signing.key)
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create -v
          keychain add-certificates
          xcode-project use-profiles --project BidCast.xcodeproj
      - name: Set TestFlight version and build number
        script: |
          MARKETING_VERSION="${IOS_MARKETING_VERSION:-1.0}"
          MIN_BUILD_NUMBER="${IOS_MIN_BUILD_NUMBER:-403}"

          cat >/tmp/next_ios_build_number.rb <<'RUBY'
          require "base64"
          require "json"
          require "net/http"
          require "openssl"
          require "uri"

          def b64url(value)
            Base64.urlsafe_encode64(value).delete("=")
          end

          def asc_token
            private_key = ENV.fetch("APP_STORE_CONNECT_PRIVATE_KEY").gsub("\\n", "\n")
            key = OpenSSL::PKey::EC.new(private_key)
            header = {
              alg: "ES256",
              kid: ENV.fetch("APP_STORE_CONNECT_KEY_IDENTIFIER"),
              typ: "JWT"
            }
            payload = {
              iss: ENV.fetch("APP_STORE_CONNECT_ISSUER_ID"),
              exp: Time.now.to_i + 900,
              aud: "appstoreconnect-v1"
            }
            unsigned = "#{b64url(header.to_json)}.#{b64url(payload.to_json)}"
            der_signature = key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(unsigned))
            signature_parts = OpenSSL::ASN1.decode(der_signature).value.map(&:value)
            signature = signature_parts.map { |part| part.to_s(2).rjust(32, "\0") }.join
            "#{unsigned}.#{b64url(signature)}"
          end

          def asc_get(path, token)
            uri = URI("https://api.appstoreconnect.apple.com#{path}")
            request = Net::HTTP::Get.new(uri)
            request["Authorization"] = "Bearer #{token}"
            response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
              http.request(request)
            end
            unless response.is_a?(Net::HTTPSuccess)
              warn response.body
              raise "App Store Connect request failed: #{response.code} #{path}"
            end
            JSON.parse(response.body)
          end

          token = asc_token
          bundle_id = ENV.fetch("BUNDLE_ID")
          version = ENV.fetch("MARKETING_VERSION")
          minimum = ENV.fetch("MIN_BUILD_NUMBER").to_i

          apps = asc_get("/v1/apps?filter[bundleId]=#{URI.encode_www_form_component(bundle_id)}", token)
          app_id = apps.fetch("data").first&.fetch("id")
          raise "No App Store Connect app found for #{bundle_id}" unless app_id

          pre_versions = asc_get("/v1/preReleaseVersions?filter[app]=#{app_id}&filter[version]=#{URI.encode_www_form_component(version)}", token)
          pre_version_id = pre_versions.fetch("data").first&.fetch("id")

          max_uploaded = 0
          if pre_version_id
            path = "/v1/builds?filter[preReleaseVersion]=#{pre_version_id}&limit=200"
            loop do
              payload = asc_get(path, token)
              payload.fetch("data").each do |build|
                raw = build.dig("attributes", "version").to_s
                max_uploaded = [max_uploaded, raw.to_i].max if raw.match?(/\A\d+\z/)
              end
              next_link = payload.dig("links", "next")
              break unless next_link
              path = URI(next_link).request_uri
            end
          end

          puts [minimum, max_uploaded + 1].max
          RUBY

          export MARKETING_VERSION
          export MIN_BUILD_NUMBER
          BUILD_NUMBER="$(ruby /tmp/next_ios_build_number.rb)"
          /bin/echo "Setting MARKETING_VERSION=${MARKETING_VERSION}"
          /bin/echo "Setting CURRENT_PROJECT_VERSION=${BUILD_NUMBER}"
          /usr/bin/perl -0pi -e "s/MARKETING_VERSION = [0-9.]+;/MARKETING_VERSION = ${MARKETING_VERSION};/g" BidCast.xcodeproj/project.pbxproj
          /usr/bin/perl -0pi -e "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" BidCast.xcodeproj/project.pbxproj
          /usr/bin/grep -n "MARKETING_VERSION" BidCast.xcodeproj/project.pbxproj
          /usr/bin/grep -n "CURRENT_PROJECT_VERSION" BidCast.xcodeproj/project.pbxproj
      - name: Build iOS
        script: |
          # Find the manual provisioning profile downloaded by the prior
          # `app-store-connect fetch-signing-files` step. Codemagic places
          # them at ~/Library/MobileDevice/Provisioning\ Profiles/.
          # Read the embedded plist to get the profile's Name field.
          PROFILE_FILE=$(/bin/ls -t \
            ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision \
            ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision \
            2>/dev/null | /usr/bin/head -1)
          if [ -z "$PROFILE_FILE" ]; then
            /bin/echo "ERROR: no .mobileprovision file found after signing step"
            /bin/ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>&1 || true
            /bin/ls -la ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ 2>&1 || true
            exit 1
          fi
          /usr/bin/security cms -D -i "$PROFILE_FILE" > /tmp/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
          /bin/echo "Using PROFILE_FILE: $PROFILE_FILE"
          /bin/echo "Using PROFILE_NAME: $PROFILE_NAME"
          xcodebuild \
            -project BidCast.xcodeproj \
            -scheme BidCast \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/BidCast.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=$TEAM_ID \
            -allowProvisioningUpdates \
            archive
      - name: Export IPA
        script: |
          /usr/libexec/PlistBuddy -c "Set :method app-store-connect" /Users/builder/export_options.plist
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/BidCast.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath $CM_BUILD_DIR/ipa \
            -allowProvisioningUpdates
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
