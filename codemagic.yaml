workflows:
  ios-release:
    name: BidCast iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_cred
      vars:
        BUNDLE_ID: io.bidcast
        TEAM_ID: YQGQU3RV34
      xcode: "26.4"
    scripts:
      - name: Inspect Xcode project layout
        script: |
          ls -la
          find . -maxdepth 2 \( -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name 'Podfile' \) | sort
      - name: Set up code signing
        script: |
          keychain initialize
          python3 setup_signing.py
          export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/dist_signing.key)
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create -v
          keychain add-certificates
          xcode-project use-profiles --project BidCast.xcodeproj
      - name: Build iOS
        script: |
          # Find the manual provisioning profile downloaded by the prior
          # `app-store-connect fetch-signing-files` step. Codemagic places
          # them at ~/Library/MobileDevice/Provisioning\ Profiles/.
          # Read the embedded plist to get the profile's Name field.
          PROFILE_FILE=$(/bin/ls -t ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | /usr/bin/head -1)
          if [ -z "$PROFILE_FILE" ]; then
            /bin/echo "ERROR: no .mobileprovision file found after signing step"
            /bin/ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>&1 || true
            exit 1
          fi
          PROFILE_NAME=$(/usr/bin/security cms -D -i "$PROFILE_FILE" 2>/dev/null | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin)
          /bin/echo "Using PROFILE_FILE: $PROFILE_FILE"
          /bin/echo "Using PROFILE_NAME: $PROFILE_NAME"
          xcodebuild \
            -project BidCast.xcodeproj \
            -scheme BidCast \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/BidCast.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=$TEAM_ID \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            -allowProvisioningUpdates \
            archive
      - name: Export IPA
        script: |
          /usr/libexec/PlistBuddy -c "Set :method app-store-connect" /Users/builder/export_options.plist
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/BidCast.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath $CM_BUILD_DIR/ipa \
            -allowProvisioningUpdates
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
